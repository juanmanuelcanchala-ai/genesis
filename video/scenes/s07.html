<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/stage.css" />
    <style>
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 38% 48%;
      }
      .bg {
        position: absolute;
        inset: -40px;
        background: url(../assets/broll_grill.png) center/cover;
        opacity: 0.16;
        filter: saturate(0.8);
      }
      .shade {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 700px at 25% 45%, #0c110f55, #0c110fee 75%),
          linear-gradient(90deg, #0c110fcc 0%, #0c110f99 45%, #0c110fee 70%);
      }
      .phonewrap {
        position: absolute;
        left: 230px;
        top: 52px;
        width: 430px;
        height: 900px;
        transform-origin: 50% 0;
        transform: scale(0.94);
      }
      .phonewrap .phone {
        left: 0;
        top: 0;
      }
      .wa-head .avatar.g {
        background: linear-gradient(140deg, #f2b33d, #e0892a);
        color: #1b1206;
      }
      .msgs {
        gap: 0;
      }
      .m {
        display: flex;
        flex-direction: column;
        flex: none;
      }
      .m > .bubble {
        margin-top: 8px;
      }
      .m > .sys {
        margin-top: 10px;
      }
      .bubble.in {
        transform-origin: 0 100%;
      }
      .bubble.out {
        transform-origin: 100% 100%;
      }
      .bubble.mini {
        min-width: 76px;
      }
      .bubble.photo {
        min-width: 0;
      }
      .bubble.photo img {
        width: 220px;
        height: 220px;
      }
      .bubble.wide {
        max-width: 92%;
      }
      .bubble .tick {
        color: #53bdeb;
        letter-spacing: -3px;
        margin-left: 3px;
      }
      .bubble.wide .btns {
        margin-top: 26px;
      }
      /* input bar: Rosa types her "Sí" and sends it */
      .wa-input .field {
        position: relative;
        color: #111b21;
      }
      .wa-input .field .ph {
        position: absolute;
        left: 18px;
        color: #8696a0;
      }
      .wa-input .field .caret {
        display: inline-block;
        width: 2px;
        height: 22px;
        margin-left: 1px;
        background: #1fa855;
        vertical-align: middle;
      }
      .wa-input .send {
        position: relative;
      }
      .wa-input .send .mic,
      .wa-input .send .arrow {
        position: absolute;
        left: 50%;
        top: 50%;
      }
      .wa-input .send .mic {
        width: 9px;
        height: 16px;
        margin: -8px 0 0 -4.5px;
        border-radius: 5px;
        background: #fff;
      }
      .wa-input .send .arrow {
        width: 0;
        height: 0;
        margin: -9px 0 0 -5px;
        border-left: 16px solid #fff;
        border-top: 9px solid transparent;
        border-bottom: 9px solid transparent;
      }
      .sys {
        align-self: center;
        padding: 6px 12px;
        border-radius: 8px;
        background: #fff3c4;
        font: 600 13px/1 var(--font);
        color: #54656f;
        letter-spacing: 0.02em;
      }

      /* right column */
      .right {
        left: 800px;
        top: 140px;
        width: 1000px;
      }
      .steps {
        display: flex;
        gap: 14px;
        margin-top: 22px;
      }
      .step {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        font: 650 22px/1.2 var(--font);
        color: var(--muted);
      }
      .step .n {
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font: 800 19px/1 var(--display);
        color: var(--muted);
        position: relative;
      }
      .step .n .ck {
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background: var(--green);
        color: #06200f;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 900 20px/1 var(--display);
      }
      .ficha {
        position: absolute;
        left: 0;
        top: 140px;
        width: 1000px;
        padding: 22px 28px 20px;
        border-radius: 26px;
        background: linear-gradient(180deg, #17211df2, #121a17f2);
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px #0008;
      }
      .ficha .hd {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .ficha .hd .ttl {
        font: 750 32px/1.1 var(--display);
        letter-spacing: -0.01em;
      }
      .ficha .hd .ttl span {
        color: var(--muted);
        font-weight: 550;
      }
      .ficha .hd .sp {
        flex: 1;
      }
      .status {
        position: relative;
        height: 40px;
        min-width: 260px;
      }
      .status .pill {
        position: absolute;
        right: 0;
        top: 0;
        padding: 11px 16px;
        font-size: 19px;
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }
      .fld {
        position: relative;
        padding: 10px 16px 11px;
        border-radius: 14px;
        background: var(--bg-2);
        border: 1px solid var(--line);
      }
      .fld .lb {
        font: 600 13px/1 var(--font);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .fld .vl {
        margin-top: 6px;
        font: 600 21px/1.25 var(--font);
        color: var(--text);
      }
      .fld.miss {
        border: 1.5px dashed var(--gold);
        background: #f2b33d10;
      }
      .fld .vl .falta {
        color: var(--gold);
      }
      .fld .ok {
        position: absolute;
        right: 14px;
        top: 12px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--green);
        color: #06200f;
        font: 900 15px/26px var(--display);
        text-align: center;
      }
      .ficha .foot {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .ficha .foot .chip {
        font-size: 18px;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body data-scene="s07">
    <div class="stage">
      <div class="cam" id="cam">
        <div class="bg" id="bg"></div>
        <div class="shade"></div>

        <div class="phonewrap" id="phw">
          <div class="phone">
            <div class="screen">
              <div class="notch"></div>
              <div class="wa-head">
                <div class="avatar g">G</div>
                <div>
                  <div class="name">Génesis</div>
                  <div class="status" id="wstatus">en línea</div>
                </div>
              </div>
              <div class="wa-body">
                <div class="msgs" id="msgs"></div>
              </div>
              <div class="wa-input">
                <div class="field">
                  <span class="ph" id="ph">Mensaje</span
                  ><span id="typed"></span><i class="caret" id="caret"></i>
                </div>
                <div class="send" id="send">
                  <i class="mic" id="mic"></i><i class="arrow" id="arrow"></i>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="abs right">
          <div class="kicker" id="kick">Antes de crear, confirma</div>
          <div class="steps" id="steps">
            <div class="step" id="st0">
              <div class="n">
                1
                <div class="ck">✓</div>
              </div>
              Una sola pregunta
            </div>
            <div class="step" id="st1">
              <div class="n">
                2
                <div class="ck">✓</div>
              </div>
              Lee el resumen
            </div>
            <div class="step" id="st2">
              <div class="n">
                3
                <div class="ck">✓</div>
              </div>
              Rosa dice sí
            </div>
          </div>

          <div class="ficha" id="ficha">
            <div class="hd">
              <div class="ttl" id="ttl">Ficha del negocio</div>
              <div class="sp"></div>
              <div class="status">
                <span class="pill run" id="pMiss">Falta 1 dato</span>
                <span class="pill done" id="pDone">✓ Completo</span>
              </div>
            </div>
            <div class="grid" id="grid"></div>
            <div class="foot">
              <span class="chip">Muse Spark 1.3</span>
              <span class="small"
                >Detecta el dato que falta y redacta una sola pregunta</span
              >
            </div>
          </div>
        </div>
      </div>
      <div class="tag">
        <span class="dot"></span>Ensayo real · modelos de Meta en vivo ·
        WhatsApp simulado
      </div>
    </div>
    <script src="../build/timeline.js"></script>
    <script src="../build/run.js"></script>
    <script src="../lib/stage.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const RUN = window.RUN || { lines: [], events: [] };
      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const md = (s) => esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
      const isChat = (l) =>
        l.who === "Rosa → Génesis" || l.who === "Génesis → Rosa";

      // ---- Real rehearsal data
      const iSpec = RUN.lines.findIndex((l) => /^spec/.test(l.kind));
      const before = RUN.lines.slice(0, iSpec < 0 ? 0 : iSpec).filter(isChat);
      const after = RUN.lines.slice(iSpec < 0 ? 0 : iSpec).filter(isChat);
      const prior = before.filter((l) => !/^🎤/.test(l.text)).slice(-6); // the end of s05's chat (photos, "listo", "Dame un momentico…")
      const iQ = after.findIndex((l) => l.who.startsWith("Génesis"));
      const q = after[iQ];
      const ans = after.slice(iQ + 1).find((l) => l.who.startsWith("Rosa"));
      const iSum = after.findIndex((l) => l.kind === "wa.buttons");
      const sum = after[iSum];
      const yes = after.slice(iSum + 1).find((l) => l.who.startsWith("Rosa"));
      const ack =
        yes &&
        after
          .slice(after.indexOf(yes) + 1)
          .find((l) => l.who.startsWith("Génesis"));
      const gap =
        q && prior.length ? Math.round(q.t - prior[prior.length - 1].t) : null;

      const specs = RUN.events.filter((e) => e.kind === "spec.ready");
      const spec0 = specs[0] && specs[0].data;
      const spec1 = specs[specs.length - 1] && specs[specs.length - 1].data;

      // ---- Chat
      const msgs = $("msgs");
      const M = [];
      function add(l, opts = {}) {
        const w = document.createElement("div");
        w.className = "m";
        const b = document.createElement("div");
        if (opts.sys) {
          b.className = "sys";
          b.textContent = opts.sys;
        } else {
          const out = l.who.startsWith("Rosa");
          let text = l.text,
            btns = [];
          const mb = text.match(/\s*\[([^\]]+)\]\s*$/);
          if (l.kind === "wa.buttons" && mb) {
            btns = mb[1].split("|").map((s) => s.trim());
            text = text.slice(0, mb.index);
          }
          b.className =
            "bubble " +
            (out ? "out" : "in") +
            (btns.length ? " wide" : "") +
            (opts.at >= 0 && text.length < 6 ? " mini" : "");
          const ph = out && text.match(/^📷\D*(\d+)/);
          if (ph) {
            b.className = "bubble out photo";
            text = "";
          }
          b.innerHTML =
            (ph ? `<img src="../assets/foto_${ph[1]}.png" />` : md(text)) +
            (btns.length
              ? `<div class="btns">${btns.map((x) => `<div>${esc(x)}</div>`).join("")}</div>`
              : "") +
            `<span class="time">${opts.at < 0 ? "6:12" : "6:13"}${out ? '<span class="tick">✓✓</span>' : ""}</span>`;
        }
        w.appendChild(b);
        msgs.appendChild(w);
        const m = {
          w,
          b,
          at: opts.at,
          out: l && l.who.startsWith("Rosa"),
          sys: !!opts.sys,
        };
        M.push(m);
        return m;
      }
      prior.forEach((l) => add(l, { at: -1 }));
      if (gap) add(null, { sys: `${gap} s después`, at: 0.25 });

      // ---- Ficha (first spec, before the answer)
      const missing = (spec0 && spec0.spec.missing) || [];
      const H = (spec0 && spec0.highlights) || [];
      const H1 = (spec1 && spec1.highlights) || [];
      const missLabels = [];
      const grid = $("grid");
      const missEls = [];
      H.forEach((h) => {
        const miss = missing.includes(h.field);
        const d = document.createElement("div");
        d.className = "fld" + (miss ? " miss" : "");
        const later = (H1.find((x) => x.field === h.field) || h).value;
        d.innerHTML =
          `<div class="lb">${esc(h.label)}</div><div class="vl">${miss ? '<span class="falta">Falta</span>' : esc(h.value)}</div>` +
          (miss ? '<div class="ok">✓</div>' : "");
        grid.appendChild(d);
        if (miss) {
          missLabels.push(h.label.toLowerCase());
          missEls.push({
            d,
            vl: d.querySelector(".vl"),
            ok: d.querySelector(".ok"),
            value: later,
          });
        }
      });
      $("pMiss").textContent = missLabels.length
        ? `Falta ${missLabels.length} dato${missLabels.length > 1 ? "s" : ""}: ${missLabels.join(", ")}`
        : "Falta 1 dato";
      if (spec0)
        $("ttl").innerHTML =
          `Ficha <span>· ${esc(spec0.spec.business_name)}</span>`;

      let mQ, mA, mS, mY, mK;
      scene((t, S) => {
        const T = {
          q: S.cue("génesis") - 0.15,
          a: S.cue("pregunta") + 0.05,
          s: S.cue("resumen") - 0.35,
          tap: S.cue("confirma") - 0.05, // Rosa starts typing "Sí"
          y: S.cue("confirma") + 0.4, // …and sends it
          ok: S.cue("sí") - 0.05, // narration "sí": ficha confirmed
          k: 0,
        };
        T.k = Math.min(S.D - 0.9, T.y + 0.6);
        if (!mQ) {
          if (q) mQ = add(q, { at: T.q });
          if (ans) mA = add(ans, { at: T.a });
          if (sum) mS = add(sum, { at: T.s });
          if (yes) mY = add(yes, { at: T.y });
          if (ack) mK = add(ack, { at: T.k });
        }
        const k = S.p(t, 0, S.D);
        $("cam").style.transform = `scale(${1.035 + 0.015 * S.ease(k)})`;
        $("bg").style.transform = `scale(1.06) translateX(${-20 * k}px)`;

        let typing = false;
        M.forEach((m) => {
          const bt = m.b.querySelector(".btns");
          if (bt) m.b.querySelector(".time").style.bottom = bt.offsetHeight + 6 + "px";
          if (m.at < 0) {
            m.w.style.height = m.b.offsetHeight + (m.sys ? 10 : 8) + "px";
            return;
          }
          const dur = m.b.offsetHeight > 300 ? 0.7 : 0.42;
          const x = S.p(t, m.at, m.at + dur);
          m.w.style.height =
            (S.ease(x) * (m.b.offsetHeight + (m.sys ? 10 : 8))).toFixed(2) +
            "px";
          S.pop(m.b, S.p(t, m.at + 0.06, m.at + 0.5));
          if (!m.out && !m.sys && t > m.at - 0.6 && t < m.at) typing = true;
        });
        $("wstatus").textContent = typing ? "escribiendo…" : "en línea";

        // Rosa types "Sí" in the input bar and sends it (as in the rehearsal)
        const yTxt = yes ? yes.text : "";
        const typing2 = t >= T.tap && t < T.y;
        $("typed").textContent = typing2
          ? yTxt.slice(0, Math.round(S.p(t, T.tap, T.y - 0.12) * yTxt.length))
          : "";
        $("ph").style.opacity = typing2 ? 0 : 1;
        $("caret").style.opacity = typing2 && Math.cos(t * 12) > -0.3 ? 1 : 0;
        $("mic").style.opacity = typing2 ? 0 : 1;
        $("arrow").style.opacity = typing2 ? 1 : 0;
        const press = S.p(t, T.y - 0.12, T.y) * (1 - S.p(t, T.y, T.y + 0.15));
        $("send").style.transform = `scale(${(1 - 0.12 * press).toFixed(3)})`;

        // right column
        S.fade($("kick"), S.p(t, 0.1, 0.7));
        S.fade($("steps"), S.p(t, 0.2, 0.9), 20);
        S.fade($("ficha"), S.p(t, 0.35, 1.05), 30);
        const stepState = [
          [S.cue("faltaba") - 0.1, T.a + 0.3],
          [T.s, T.y],
          [T.tap, T.ok + 0.1],
        ];
        stepState.forEach(([a, d], i) => {
          const el = $("st" + i);
          const act = S.p(t, a, a + 0.3),
            done = S.p(t, d, d + 0.3);
          el.style.borderColor =
            done > 0
              ? `rgba(37,211,102,${0.25 + 0.35 * done})`
              : act > 0
                ? `rgba(242,179,61,${0.6 * act})`
                : "";
          el.style.color = act > 0 ? "var(--text)" : "";
          el.style.background =
            done > 0 ? "#25d36612" : act > 0 ? "#f2b33d12" : "";
          const n = el.querySelector(".n");
          n.style.borderColor = act > 0 ? "var(--gold)" : "";
          n.style.color = act > 0 ? "var(--gold)" : "";
          const ck = el.querySelector(".ck");
          ck.style.opacity = S.easeOut(done);
          ck.style.transform = `scale(${0.6 + 0.4 * S.back(done)})`;
        });

        // ficha: missing field resolved by Rosa's answer
        const miss0 = S.p(t, S.cue("faltaba") - 0.1, S.cue("faltaba") + 0.4);
        const res = S.p(t, T.a + 0.25, T.a + 0.75);
        missEls.forEach((m) => {
          const pulse = res > 0 ? 0 : miss0 * (0.5 + 0.5 * Math.cos(t * 5));
          m.d.style.boxShadow =
            res > 0
              ? `0 0 0 ${(2 * (1 - res)).toFixed(2)}px #25d36699, 0 0 ${(30 * (1 - res) + 8).toFixed(1)}px #25d36633`
              : `0 0 ${(24 * pulse).toFixed(1)}px #f2b33d55`;
          if (res > 0) {
            m.d.classList.remove("miss");
            m.d.style.borderColor = "#25d36688";
            m.d.style.background = "#25d36610";
            S.type(m.vl, m.value, S.p(t, T.a + 0.25, T.a + 0.7));
          } else {
            m.d.classList.add("miss");
            m.d.style.borderColor = "";
            m.d.style.background = "";
            m.vl.innerHTML = '<span class="falta">Falta</span>';
          }
          m.ok.style.opacity = S.easeOut(S.p(t, T.a + 0.55, T.a + 0.85));
        });
        const sw = S.p(t, T.a + 0.4, T.a + 0.8);
        S.pop($("pMiss"), miss0 * (1 - sw));
        S.pop($("pDone"), sw);
        const okAll = S.p(t, T.ok, T.ok + 0.5);
        $("ficha").style.borderColor = okAll > 0 ? `rgba(37,211,102,${(0.55 * okAll).toFixed(3)})` : "";
        $("ficha").style.boxShadow = `0 30px 90px #0008, 0 0 ${(50 * okAll).toFixed(1)}px rgba(37,211,102,${(0.14 * okAll).toFixed(3)})`;
      });
    </script>
  </body>
</html>
