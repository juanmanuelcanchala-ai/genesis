<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../lib/stage.css" />
    <style>
      .bg {
        position: absolute;
        inset: -60px;
        background: url(../assets/broll_grill.png) center/cover;
        filter: blur(7px) brightness(0.55) saturate(0.9);
        transform-origin: 70% 50%;
      }
      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            90deg,
            #0c110ff2 0%,
            #0c110fd0 42%,
            #0c110f70 75%,
            #0c110f99 100%
          ),
          linear-gradient(0deg, #0c110fee 0%, #0c110f00 32%);
      }
      .kick {
        left: 120px;
        top: 150px;
      }
      .big {
        left: 108px;
        top: 205px;
        font: 800 300px/1 var(--display);
        letter-spacing: -0.05em;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-shadow: 0 10px 60px #f2b33d30;
      }
      .big .pct {
        font-size: 190px;
        letter-spacing: -0.02em;
        margin-left: 18px;
      }
      .line {
        left: 120px;
        top: 545px;
        width: 900px;
        font: 650 54px/1.15 var(--display);
        letter-spacing: -0.02em;
      }
      .line .inf {
        position: relative;
        color: var(--text);
      }
      .line .inf::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2px;
        height: 6px;
        border-radius: 3px;
        background: var(--gold);
        transform-origin: left;
        transform: scaleX(var(--u, 0));
      }
      .src {
        left: 120px;
        top: 720px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .src .bar {
        width: 28px;
        height: 2px;
        background: var(--faint);
      }
      .gridcard {
        right: 150px;
        top: 175px;
        width: 590px;
        padding: 36px 40px 34px;
        border-radius: 28px;
        background: #0c110fb8;
        border: 1px solid var(--line);
        box-shadow: 0 30px 90px #0009;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 14px;
      }
      .grid i {
        display: block;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #2b3a33;
      }
      .gcap {
        margin-top: 28px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font: 500 22px/1.3 var(--font);
        color: var(--muted);
      }
      .gcap b {
        color: var(--gold);
        font-weight: 700;
      }
      .legend {
        display: flex;
        gap: 22px;
        font: 500 19px/1 var(--font);
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .legend span::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--c);
      }
    </style>
  </head>
  <body data-scene="s02">
    <div class="stage">
      <div class="bg" id="bg"></div>
      <div class="shade"></div>
      <div class="abs kicker kick" id="kick">No es un caso raro</div>
      <div class="abs big" id="big">
        <span id="n">0,0</span><span class="pct">%</span>
      </div>
      <div class="abs line" id="line">
        de los ocupados en Colombia son
        <span class="inf" id="inf">informales</span>
      </div>
      <div class="abs src source" id="src">
        <span class="bar"></span>Fuente: DANE, GEIH mar–may 2026
      </div>
      <div class="abs gridcard" id="card">
        <div class="grid" id="grid"></div>
        <div class="gcap" id="gcap">
          <span
            >De cada <b style="color: var(--text)">100</b> ocupados,
            <b>casi 55</b> son informales</span
          >
        </div>
        <div class="legend" id="leg" style="margin-top: 16px">
          <span style="--c: var(--gold)">Informal</span>
          <span style="--c: #2b3a33">Formal</span>
        </div>
      </div>
    </div>
    <script src="../build/timeline.js"></script>
    <script src="../build/run.js"></script>
    <script src="../lib/stage.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      const VALUE = 54.7;
      const grid = $("grid");
      const dots = [];
      for (let i = 0; i < 100; i++) {
        const d = document.createElement("i");
        grid.appendChild(d);
        dots.push(d);
      }
      scene((t, S) => {
        const k = S.p(t, 0, S.D);
        $("bg").style.transform =
          `scale(${1.06 + 0.07 * k}) translateX(${-24 * k}px)`;
        S.fade($("kick"), S.p(t, 0.15, 0.8));
        const c0 = S.cue("cincuenta") - 0.35;
        const c1 = S.cue("ciento") + 0.35;
        S.fade($("big"), S.p(t, c0 - 0.25, c0 + 0.2), 30);
        const x = S.easeOut(S.p(t, c0, c1));
        $("n").textContent = S.num(x, 0, VALUE, 1);
        // subtle settle pulse when the counter lands
        const land = S.p(t, c1 - 0.1, c1 + 0.5);
        const pulse = 1 + 0.025 * Math.sin(Math.PI * land);
        $("big").style.transform += ` scale(${pulse})`;
        $("big").style.transformOrigin = "left center";
        // dot grid fills with the counter, row by row; dot 55 is filled 70 %
        S.pop($("card"), S.p(t, 0.5, 1.3));
        $("card").style.transform += ` translateY(${-8 * k}px)`;
        const filled = VALUE * x;
        dots.forEach((d, i) => {
          const f = Math.max(0, Math.min(1, filled - i));
          if (f >= 1) d.style.background = "var(--gold)";
          else if (f <= 0) d.style.background = "#2b3a33";
          else
            d.style.background = `linear-gradient(90deg, var(--gold) ${f * 100}%, #2b3a33 ${f * 100}%)`;
          d.style.boxShadow = f >= 1 ? "0 0 14px #f2b33d40" : "none";
        });
        S.fade($("gcap"), S.p(t, c1 - 0.2, c1 + 0.4), 10);
        S.fade($("leg"), S.p(t, 0.9, 1.5), 6);
        S.fade(
          $("line"),
          S.p(t, S.cue("quienes") - 0.3, S.cue("quienes") + 0.4),
          22,
        );
        const inf = S.cue("informalidad");
        $("inf").style.setProperty("--u", S.easeOut(S.p(t, inf, inf + 0.6)));
        $("inf").style.color = `color-mix(in srgb, var(--gold) ${Math.round(100 * S.p(t, inf, inf + 0.35))}%, var(--text))`;
        S.fade(
          $("src"),
          S.p(t, S.cue("colombia"), S.cue("colombia") + 0.6),
          10,
        );
      });
    </script>
  </body>
</html>
