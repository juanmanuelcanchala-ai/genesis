[project]
name = "genesis"
version = "0.1.0"
description = "From a WhatsApp voice note to a live, tested business on Meta in three minutes. Built for the Meta Global AI Developer Hackathon 2026."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
